name: Deploy to GitHub Pages

on:
  push:
    branches: [main]          # dispara en cada push a main
  workflow_dispatch:           # también permite lanzarlo manualmente desde la UI de GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Genera js/config.js con la CARTO_KEY real desde GitHub Secrets
      - name: Inject CARTO_KEY into config.js
        env:
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
        run: node scripts/build-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # habilita GitHub Pages automáticamente si no está activo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."             # sube todo el directorio raíz del proyecto

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

